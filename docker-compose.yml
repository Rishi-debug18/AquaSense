version: "3.9"

services:
  # ─────────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: aquasense_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquasense
      POSTGRES_PASSWORD: aquasense123
      POSTGRES_DB: aquasense
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquasense -d aquasense"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # FastAPI Backend
  # ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aquasense_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://aquasense:aquasense123@db:5432/aquasense
      SECRET_KEY: aquasense-super-secret-key-change-in-production
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      DEVICE_OFFLINE_TIMEOUT_MINUTES: 15
      LEAK_THRESHOLD_PERCENT: "5.0"
      HIGH_USAGE_THRESHOLD_PERCENT: "50.0"
      VERY_HIGH_USAGE_THRESHOLD_PERCENT: "100.0"
      GEMINI_API_KEY: ""
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:3000","http://frontend:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             python scripts/seed_demo_data.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ─────────────────────────────────────────────
  # React Frontend (for production preview)
  # ─────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aquasense_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
